    private-key-path: classpath:cert/apiclient_key.pem  # 商户私钥文件路径
    merchant-serial-number: 68EFFAD8D54020146A1372141B6EEBA1B52D6B64  # 商户证书序列号
    api-v3-key: idNmbaZ0EPgwbvYbJDGp2EGlwQDezU6d  # API v3密钥（32位）
    notify-url: https://xx.aieo.cn/api/payment/wechat/notify  # 异步回调地址
    sandbox: false  # 是否沙箱环境
