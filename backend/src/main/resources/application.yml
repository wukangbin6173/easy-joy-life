server:
  port: 8080

spring:
  application:
    name: easy-joy-life-system
  
  # MySQL数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/easy_joy_life_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: easyjoy
    password: EasyJoy2026!
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update  # 自动更新表结构
    show-sql: true          # 显示SQL日志用于调试
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    
  # 禁用数据初始化脚本（表已存在）
  sql:
    init:
      mode: never

  # Redis缓存配置
  redis:
    host: localhost
    port: 6379
    password:  # 如果设置了密码则填写
    database: 0
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
  
  # 启用缓存
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 缓存过期时间（毫秒）

  # Jackson配置
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    modules:
      - com.fasterxml.jackson.datatype.jsr310.JavaTimeModule

