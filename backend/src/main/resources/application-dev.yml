server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: qiupai-system
  
  # H2 Database for development
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:qiupai_system;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: 
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
        login-username: admin
        login-password: 123456

  # H2 Console for development
  h2:
    console:
      enabled: true
      path: /h2-console

  # Initialize database
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  # Disable Redis for development (use in-memory cache)
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.qiupai.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.qiupai: debug
    org.springframework.security: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"

# 自定义配置
qiupai:
  jwt:
    secret: qiupai-jwt-secret-key-2024
    expiration: 86400000 # 24小时
  wechat:
    appid: ${WECHAT_APPID:wx1234567890abcdef}
    secret: ${WECHAT_SECRET:test-secret}
    mch-id: ${WECHAT_MCH_ID:1234567890}
    api-key: ${WECHAT_API_KEY:test-api-key}
  mqtt:
    broker: tcp://localhost:1883
    client-id: qiupai-server
    username: 
    password: 
  file:
    upload-path: ./uploads/
    access-url: http://localhost:8080/api/files/