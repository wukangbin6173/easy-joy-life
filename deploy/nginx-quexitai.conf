server {
    server_name www.quexitai.com quexitai.com;

    # 兼容旧上传文件地址，交给后端从 upload.base-path 读取，避免 nginx 静态目录和后端上传目录不一致导致 404。
    location /uploads/ {
        rewrite ^/uploads/([0-9]{8})/(.+)$ /api/upload/files/$1/$2 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }

    # API和测试接口代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    location /test/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 官网静态文件
    location / {
        root /opt/easy-joy-life/website;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 7d;
        add_header Cache-Control "public";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/www.quexitai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.quexitai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = quexitai.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = www.quexitai.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name www.quexitai.com quexitai.com;
    return 404;
}
