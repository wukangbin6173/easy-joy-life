version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: easy-joy-life-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: easy_joy_life_db
      MYSQL_USER: easyjoylife
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - easy-joy-life-network

  redis:
    image: redis:6.2-alpine
    container_name: easy-joy-life-redis-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - easy-joy-life-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: easy-joy-life-backend-prod
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      WECHAT_APPID: ${WECHAT_APPID}
      WECHAT_SECRET: ${WECHAT_SECRET}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID}
      WECHAT_API_KEY: ${WECHAT_API_KEY}
      SERVER_DOMAIN: ${SERVER_DOMAIN}
      UPLOAD_BASE_PATH: /opt/easy-joy-life/uploads
      UPLOAD_BASE_URL: https://www.quexitai.com/api/upload/files
    volumes:
      - app_logs:/opt/easy-joy-life/logs
      - app_uploads:/opt/easy-joy-life/uploads
    depends_on:
      - mysql
      - redis
    networks:
      - easy-joy-life-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
  redis_data:
  app_logs:
  app_uploads:

networks:
  easy-joy-life-network:
    driver: bridge
