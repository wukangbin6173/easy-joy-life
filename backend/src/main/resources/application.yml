server:
  port: 8080

spring:
  application:
    name: easy-joy-life-system
  
  # MySQL数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/easy_joy_life_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: validate  # 使用validate，不自动创建表
    show-sql: false       # 生产环境关闭SQL日志
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
    database-platform: org.hibernate.dialect.MySQL8Dialect
    
  # 禁用H2控制台
  # h2:
  #   console:
  #     enabled: false
      
  # 禁用数据初始化脚本（表已存在）
  sql:
    init:
      mode: never

# 微信支付配置
wechat:
  pay:
    app-id: wx9f4a33e5f2b31a6d  # 小程序AppID
    mch-id: 1554487931  # 商户号
    private-key-path: classpath:cert/apiclient_key.pem  # 商户私钥路径
    merchant-serial-number: 5D34600479751B1A27F9CC5AE3B64D5509C49A8F  # 商户证书序列号
    api-v3-key: 7Bf2k9Qd4Gh1Pz6Rt3Sw5Xy8Ac0VeMjU  # API v3密钥（32位）
    # 微信支付公钥配置（推荐使用，避免证书过期问题）
    # 请将从商户平台下载的真实公钥文件放到 backend/src/main/resources/cert/wechatpay_public_key.pem
    # 并将下面的配置取消注释，填入真实的公钥ID
    public-key-path: classpath:cert/wechatpay_public_key.pem  # 微信支付公钥路径
    public-key-id: PUB_KEY_ID_0115544879312026012300191784001402  # 微信支付公钥ID，从商户平台获取
    notify-url: https://xx.aieo.cn/api/payment/wechat/notify  # 异步回调地址
    sandbox: false  # 是否沙箱环境
    domain: https://api.mch.weixin.qq.com  # 微信支付API域名
    enabled: true  # 启用微信支付
  miniprogram:
    app-secret: b5919b96d9065dadbf43082ad65aaf56  # 小程序AppSecret

# Redis缓存配置
  redis:
    host: localhost
    port: 6379
    password:  # 如果设置了密码则填写
    database: 0
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
  
  # 启用缓存
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 缓存过期时间（毫秒）

# 支付宝配置
alipay:
  app-id: 2021006128663181 
  private-key: 
  public-key:  
  gateway-url: https://openapi.alipaydev.com/gateway.do  # 沙箱网关
  sign-type: RSA2
  charset: UTF-8
  format: json
  return-url: https://xx.aieo.cn/payment/return  # 同步回调地址
  notify-url: https://xx.aieo.cn/api/payment/alipay/notify  # 异步回调地址
  sandbox: true  # 是否沙箱环境

# 日志配置
logging:
  level:
    com.easyjoylife: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE